<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fantom</title>
  <meta name="description" content="Dopadni Fantoma! Městská hra pro detektivy v ulicích.">
  <meta name="theme-color" content="#0b0d1a">

  <!-- Spuštění jako aplikace z plochy telefonu -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantom">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Mapy: Leaflet + OpenStreetMap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <span class="title">FANTOM</span>
    <span id="status">Zjišťuji polohu…</span>
  </header>

  <button id="locate" type="button" aria-label="Moje poloha">◎</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
